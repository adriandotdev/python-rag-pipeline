<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">RAG pipeline architecture</title>
<desc id="desc">Indexing: the policy PDF is text-extracted, chunked, embedded and stored in ChromaDB. Querying: the question from the Streamlit chat is embedded, the four closest chunks are retrieved from ChromaDB, a prompt is built and sent with the chat history to a local Ollama model, and the answer returns to the chat.</desc>
<style>.t{font-size:17px;font-weight:700;fill:#0f172a;text-anchor:middle}.s{font-size:14px;fill:#334155;text-anchor:middle}.l{font-size:13px;fill:#475569}.h{font-size:15px;font-weight:700;letter-spacing:.5px}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1200" height="730" fill="#ffffff"/>
<rect x="16" y="24" width="1168" height="188" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="16" y="396" width="1168" height="312" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" class="h" fill="#1d4ed8">1. INDEXING  (runs only when the collection is empty)</text>
<text x="40" y="430" class="h" fill="#047857">2. RETRIEVAL AND GENERATION  (runs for every question)</text>
<rect x="40" y="86" width="250" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="165" y="120" class="t">Policy handbook</text>
<text x="165" y="146" class="s">employee_policy.pdf</text>
<text x="165" y="166" class="s">4 pages</text>
<rect x="330" y="86" width="250" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="455" y="120" class="t">Extract text</text>
<text x="455" y="146" class="s">pypdf</text>
<text x="455" y="166" class="s">all pages joined</text>
<rect x="620" y="86" width="250" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="745" y="120" class="t">Chunk text</text>
<text x="745" y="146" class="s">800 characters</text>
<text x="745" y="166" class="s">150 overlap</text>
<rect x="910" y="86" width="250" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1035" y="120" class="t">Embed chunks</text>
<text x="1035" y="146" class="s">all-MiniLM-L6-v2</text>
<text x="1035" y="166" class="s">sentence-transformers</text>
<path d="M290 136H328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M580 136H618" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M870 136H908" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M620 268V338C620 350 676 360 745 360S870 350 870 338V268" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<ellipse cx="745" cy="268" rx="125" ry="20" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<text x="745" y="316" class="t">ChromaDB</text><text x="745" y="340" class="s">./chroma_db (on disk)</text>
<path d="M1035 186V308H872" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="954" y="298" class="l" text-anchor="middle">chunks + vectors</text>
<rect x="40" y="450" width="250" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="165" y="484" class="t">Streamlit chat</text>
<text x="165" y="510" class="s">app.py, pages/chat.py</text>
<text x="165" y="530" class="s">user asks a question</text>
<rect x="330" y="450" width="250" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="455" y="484" class="t">Embed question</text>
<text x="455" y="510" class="s">all-MiniLM-L6-v2</text>
<text x="455" y="530" class="s">same model as indexing</text>
<rect x="620" y="450" width="250" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="745" y="484" class="t">Retrieve</text>
<text x="745" y="510" class="s">similarity search</text>
<text x="745" y="530" class="s">top 4 chunks</text>
<rect x="910" y="450" width="250" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1035" y="484" class="t">Build prompt</text>
<text x="1035" y="510" class="s">instructions + chat history</text>
<text x="1035" y="530" class="s">context + question</text>
<path d="M290 500H328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M580 500H618" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M870 500H908" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M745 362V448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="757" y="382" class="l" text-anchor="start">query vector / matching chunks</text>
<rect x="910" y="588" width="250" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1035" y="622" class="t">LLM via Ollama</text>
<text x="1035" y="648" class="s">llama3.2</text>
<text x="1035" y="668" class="s">localhost:11434/v1</text>
<path d="M1035 550V586" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M908 638H165V552" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="536" y="628" class="l" text-anchor="middle">answer</text>
</svg>
